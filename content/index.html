  }
  :root{
    --bg: #eaf2fc;
    --bg-2: #dceafd;
    --panel: #ffffff;
    --panel-2: #eef6ff;
    --line: #cfe3fb;
    --sky-light: #cfe3fb;
    --sky-deep: #6fa3e0;
    --blue: #5b8fd6;
    --blue-deep: #3d6cb0;
    --pink: #ff9fb0;
    --pink-deep: #ff738c;
    --coral: #f7876c;
    --gold: #ffc94d;
    --mint: #bfe3e0;
    --ink: #33415c;
    --ink-dim: #7086a8;
    --ink-faint: #a9bcd6;
    --paper: #f4f9ff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Maru Gothic', sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    position:fixed; inset:0;
    background:
      radial-gradient(circle at 18% 8%, rgba(255,255,255,0.55) 0, rgba(255,255,255,0) 55%),
      radial-gradient(1.6px 1.6px at center, rgba(61,108,176,0.16) 45%, transparent 46%) 0 0/14px 14px,
      linear-gradient(180deg, var(--sky-light) 0%, var(--bg) 55%, var(--bg-2) 100%);
  }
  /* stars */
  .petal{
    position:absolute; top:-5vh;
    width:13px; height:13px;
    clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    opacity:0.75;
    animation:fall linear infinite;
    z-index:1;
    pointer-events:none;
    filter:drop-shadow(0 0 1.5px rgba(255,255,255,0.9)) drop-shadow(0 1px 2px rgba(20,50,90,0.18));
  }
  @keyframes fall{
    0%{ transform:translate(0,0) rotate(0deg); }
    50%{ transform:translate(24px,55vh) rotate(180deg); }
    100%{ transform:translate(-10px,112vh) rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce){ .petal{ display:none; } }

  /* ---------- hanging stars (background flourish) ---------- */
  .hang-star{
    position:absolute; top:0; width:22px; height:22px;
    clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    background:var(--gold);
    filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 3px 6px rgba(20,50,90,0.25));
    z-index:1; pointer-events:none;
    transform-origin:top center;
    animation:sway 4.5s ease-in-out infinite;
  }
  .hang-star::before{
    content:''; position:absolute; left:50%; top:-46px; width:1px; height:46px;
    background:rgba(255,255,255,0.6);
  }
  .hang-star-left{ left:8vw; }
  .hang-star-right{ right:8vw; animation-delay:-2.3s; }
  @keyframes sway{
    0%,100%{ transform:rotate(-6deg); }
    50%{ transform:rotate(6deg); }
  }
  @media (prefers-reduced-motion: reduce){ .hang-star{ animation:none; } }

  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity 1.1s ease;
    padding:6vw;
    text-align:center;
    z-index:2;
  }
  .screen.active{ opacity:1; visibility:visible; pointer-events:auto; }

  /* ---------- loading ---------- */
  .loader{
    width:34px; height:34px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--blue-deep);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- empty / not configured ---------- */
  .empty-mark{
    font-family:'Roundy Rainbows', 'Klee One', cursive;
    font-size:clamp(4.2rem, 17vw, 11rem);
    line-height:0.95;
    color:var(--blue-deep);
    text-transform:uppercase;
  }

  /* ---------- countdown ---------- */
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:0.78rem; letter-spacing:0.1em;
    color:var(--pink-deep);
    background:#fff;
    border:1px solid var(--line);
    padding:7px 18px;
    border-radius:999px;
    margin-bottom:26px;
  }
  .countdown-digits{
    font-family:'Roundy Rainbows', 'Klee One', cursive;
    font-weight:600;
    font-size:clamp(4.2rem, 17vw, 11rem);
    line-height:0.95;
    color:var(--pink-deep);
    letter-spacing:-0.01em;
    text-transform:uppercase;
  }
  .countdown-daylabel{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:clamp(0.8rem,1.6vw,1rem);
    letter-spacing:0.06em;
    color:var(--ink-dim); margin-top:16px;
  }
  .countdown-date{
    margin-top:8px; font-size:0.85rem; color:var(--ink-faint);
    font-family:'Klee One', cursive;
  }

  /* ---------- D-DAY gate ---------- */
  #screen-dday{ perspective:1400px; }
  .dday-content{
    display:flex; flex-direction:column; align-items:center;
    transform-origin:top center;
    transition:transform 0.9s cubic-bezier(.55,.05,.55,.95), opacity 0.9s ease;
    transform-style:preserve-3d;
  }
  .dday-content.flip-out{
    transform:rotateX(-100deg) translateY(-30px);
    opacity:0;
  }
  .dday-text{
    font-family:'Roundy Rainbows', 'Klee One', cursive;
    font-weight:600;
    font-size:clamp(4.2rem, 17vw, 11rem);
    line-height:0.95;
    color:var(--pink-deep);
    opacity:0;
    transform:scale(0.3);
    text-transform:uppercase;
  }
  .dday-text.pop{
    animation:ddayPop 0.7s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes ddayPop{
    0%{ transform:scale(0.3); opacity:0; }
    60%{ transform:scale(1.15); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }
  .start-btn{
    margin-top:34px;
    padding:16px 52px;
    border:none; border-radius:999px; cursor:pointer;
    font-family:'Zen Maru Gothic', sans-serif; font-weight:700; font-size:1rem;
    letter-spacing:0.06em;
    background:var(--pink-deep); color:#fff;
    opacity:0; transform:translateY(10px);
    transition:opacity 0.7s ease, transform 0.7s ease, background 0.2s ease;
    pointer-events:none;
  }
  .start-btn.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .start-btn:hover{ background:var(--coral); }
  @media (prefers-reduced-motion: reduce){
    .dday-text{ opacity:1; transform:scale(1); animation:none; }
    .dday-content.flip-out{ transform:none; opacity:0; transition:opacity 0.4s ease; }
  }

  /* ---------- video ---------- */
  #screen-video{ padding:0; background:#0d1b2e; }
  #mainVideo{ width:100%; height:100%; object-fit:contain; background:#0d1b2e; }
  .play-overlay{
    position:absolute; inset:0; margin:auto; width:84px; height:84px; border-radius:50%;
    background:rgba(255,255,255,0.95); border:3px solid var(--gold);
    box-shadow:0 8px 20px rgba(10,30,60,0.35);
    color:var(--blue-deep); font-size:1.6rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform 0.25s ease, opacity 0.4s ease;
  }
  .play-overlay:hover{ transform:scale(1.07); }
  .play-overlay.hidden{ opacity:0; pointer-events:none; }

  /* ---------- gif ---------- */
  #screen-gif{ cursor:pointer; }
  #gifImg{
    max-width:min(72vw,520px); max-height:60vh; width:auto; height:auto;
    transition:transform 0.35s ease;
    filter:
      drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff)
      drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)
      drop-shadow(1.4px 1.4px 0 #fff) drop-shadow(-1.4px 1.4px 0 #fff)
      drop-shadow(1.4px -1.4px 0 #fff) drop-shadow(-1.4px -1.4px 0 #fff)
      drop-shadow(0 10px 18px rgba(20,50,90,0.28));
  }
  #screen-gif:hover #gifImg{ transform:scale(1.02); }
  #screen-gif.switched #gifImg{ animation:pulse 0.7s ease; }
  @keyframes pulse{ 0%{transform:scale(1);} 40%{transform:scale(1.08);} 100%{transform:scale(1);} }
  .gif-hint{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; justify-content:center;
  }
  .gif-hint span{
    display:inline-flex; align-items:center; gap:6px;
    background:#fff; border:2px solid var(--gold); border-radius:999px;
    padding:7px 20px;
    font-family:'Klee One', cursive; font-size:0.9rem;
    color:var(--blue-deep);
    box-shadow:0 4px 12px rgba(20,50,90,0.18);
    animation:hintpulse 2.2s ease-in-out infinite;
  }
  @keyframes hintpulse{ 0%,100%{ opacity:0.6; transform:translateY(0); } 50%{ opacity:1; transform:translateY(-2px); } }

  /* ---------- duo (video-2 + image-3, side by side) ---------- */
  #screen-duo{ cursor:pointer; }
  .duo-row{
    display:flex; flex-direction:row; align-items:center; justify-content:center;
    gap:4vw; width:100%;
  }
  .duo-row video, .duo-row img{
    max-width:44vw; max-height:56vh; width:auto; height:auto;
    object-fit:contain; border-radius:16px;
    box-shadow:0 0 0 4px #fff, 0 10px 24px rgba(20,50,90,0.28);
    transition:transform 0.35s ease;
  }
  #screen-duo:hover .duo-row video,
  #screen-duo:hover .duo-row img{ transform:scale(1.02); }

  /* ---------- confetti / hearts canvases ---------- */
  .fx-canvas{
    position:absolute; inset:0;
    pointer-events:none;
    z-index:5;
  }


  /* ---------- reveal (white fade) ---------- */
  #whiteOverlay{
    position:fixed; inset:0; z-index:60;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.6) 0, rgba(255,255,255,0) 55%),
      radial-gradient(1.6px 1.6px at center, rgba(61,108,176,0.14) 45%, transparent 46%) 0 0/14px 14px,
      linear-gradient(180deg, var(--sky-light) 0%, var(--paper) 60%, var(--bg-2) 100%);
    opacity:0; pointer-events:none;
    transition:opacity 2.6s ease;
    display:flex; align-items:center; justify-content:center;
  }
  #whiteOverlay.show{ opacity:1; pointer-events:auto; }
  .reveal-content{
    opacity:0; transform:translateY(6px) scale(0.92);
    transition:opacity 2s ease 0.35s, transform 2s cubic-bezier(.34,1.56,.64,1) 0.35s;
    text-align:center; padding:6vw;
    position:relative; z-index:10;
  }
  .reveal-content.show{ opacity:1; transform:translateY(0) scale(1); }
  #revealMessage{
    font-family:'Zen Maru Gothic', sans-serif; font-weight:700;
    font-size:clamp(1.9rem, 5.2vw, 3.4rem);
    color:var(--blue-deep);
    letter-spacing:-0.01em;
  }
  #revealName{
    margin-top:14px; font-family:'Zen Maru Gothic', sans-serif;
    font-size:1rem; color:var(--pink-deep);
  }

</style>
</head>
<body>

<div id="app">
  <div class="hang-star hang-star-left" aria-hidden="true"></div>
  <div class="hang-star hang-star-right" aria-hidden="true"></div>
  <div class="screen active" id="screen-loading">
    <div class="loader"></div>
  </div>

  <div class="screen" id="screen-empty">
    <div class="empty-mark" id="emptyDday">🎁</div>
  </div>

  <div class="screen" id="screen-video">
    <video id="mainVideo" playsinline></video>
    <button class="play-overlay" id="playBtn" aria-label="Play video">&#9654;</button>
    <div class="hint" id="videoError" style="display:none; position:absolute; bottom:24px; left:0; right:0; text-align:center; color:#fff;"></div>
  </div>

  <div class="screen" id="screen-gif">
    <img id="gifImg" alt="Tap to continue">
    <div class="gif-hint"><span>⭐ tap ⭐</span></div>
  </div>

  <div class="screen" id="screen-duo">
    <div class="duo-row">
      <video id="duoVideo" autoplay muted loop playsinline></video>
      <img id="duoImage" alt="">
    </div>
    <div class="gif-hint" id="duoHint"><span>⭐ tap ⭐</span></div>
  </div>
</div>

<audio id="bgmAudio" loop preload="none"></audio>

<div id="whiteOverlay">
  <div class="reveal-content" id="revealContent">
    <div id="revealMessage">Happy Birthday</div>
    <div id="revealName"></div>
  </div>
</div>

<script>
(function(){
  // Media always lives here — no admin panel, nothing to configure.
  const GH_OWNER = 'sseoyi';
  const GH_REPO = 'slime';
  const GH_BRANCH = 'main';
  // This page's own resources live under content/res in the repo.
  const RES_DIR = 'content/res/';

  const screens = {
    loading: document.getElementById('screen-loading'),
    empty: document.getElementById('screen-empty'),
    video: document.getElementById('screen-video'),
    gif: document.getElementById('screen-gif'),
    duo: document.getElementById('screen-duo'),
  };

  let config = null;       // { videoUrl, gif1Url, gif2Url, revealMessage, recipientName }
  let mediaExists = { video:false, gif1:false, gif2:false };

  // ambient falling stars
  (function spawnPetals(){
    const app = document.getElementById('app');
    const count = 14;
    const colors = ['#ffc94d', '#ffffff', '#8fc1ef', '#ff9fb0'];
    for(let i=0;i<count;i++){
      const p = document.createElement('div');
      p.className = 'petal';
      const left = Math.random()*100;
      const duration = 9 + Math.random()*8;
      const delay = Math.random()*10;
      const scale = 0.6 + Math.random()*0.9;
      p.style.left = left + 'vw';
      p.style.animationDuration = duration + 's';
      p.style.animationDelay = '-' + delay + 's';
      p.style.transform = 'scale(' + scale + ')';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      app.insertBefore(p, app.firstChild);
    }
  })();

  function showScreen(name){
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  function cacheBust(url){
    return url + (url.indexOf('?') === -1 ? '?' : '&') + 't=' + Date.now();
  }

  function rawUrl(path){
    return 'https://raw.githubusercontent.com/' + GH_OWNER + '/' + GH_REPO + '/' + GH_BRANCH + '/' + path;
  }

  // Checks whether a raw file actually exists in the repo (HEAD request).
  async function fileExists(url){
    try{
      const res = await fetch(cacheBust(url), { method:'HEAD' });
      if(res.ok) return true;
      // Some hosts/proxies don't support HEAD well — fall back to GET.
      if(res.status === 405){
        const res2 = await fetch(cacheBust(url));
        return res2.ok;
      }
      return false;
    }catch(e){
      return false;
    }
  }

  // Auto-detects video.mp4, img-1.gif, and img-2.gif directly in
  // sseoyi/slime/content/res — nothing to upload or publish through this
  // page. It also opportunistically reads content/res/data.json for the
  // reveal text/name, if that file happens to exist in the repo.
  async function fetchContentData(){
    const videoUrlGuess = rawUrl(RES_DIR + 'video.mp4');
    const gif1UrlGuess = rawUrl(RES_DIR + 'img-1.gif');
    const gif2UrlGuess = rawUrl(RES_DIR + 'img-2.gif');
    const video2UrlGuess = rawUrl(RES_DIR + 'video-2.mp4');
    const image3UrlGuess = rawUrl(RES_DIR + 'image-3.jpg');
    const bgmUrlGuess = rawUrl(RES_DIR + 'bgm.mp3');

    const [videoFound, gif1Found, gif2Found, video2Found, image3Found, bgmFound] = await Promise.all([
      fileExists(videoUrlGuess),
      fileExists(gif1UrlGuess),
      fileExists(gif2UrlGuess),
      fileExists(video2UrlGuess),
      fileExists(image3UrlGuess),
      fileExists(bgmUrlGuess),
    ]);

    mediaExists.video = videoFound;
    mediaExists.gif1 = gif1Found;
    mediaExists.gif2 = gif2Found;

    let data = {};
    try{
      const res = await fetch(cacheBust(rawUrl(RES_DIR + 'data.json')));
      if(res.ok) data = await res.json();
    }catch(e){ /* optional — fine if it doesn't exist */ }

    config = {
      videoUrl: videoFound ? videoUrlGuess : '',
      gif1Url: gif1Found ? gif1UrlGuess : '',
      gif2Url: gif2Found ? gif2UrlGuess : '',
      video2Url: video2Found ? video2UrlGuess : '',
      image3Url: image3Found ? image3UrlGuess : '',
      bgmUrl: bgmFound ? bgmUrlGuess : '',
      revealMessage: data.revealMessage,
      recipientName: data.recipientName,
    };
  }

  function hasMedia(){
    return !!(config && (config.videoUrl || config.gif1Url || config.gif2Url));
  }

  function startExperience(){
    if(config.videoUrl){
      const video = document.getElementById('mainVideo');
      const playBtn = document.getElementById('playBtn');
      const errEl = document.getElementById('videoError');
      video.src = config.videoUrl;
      video.muted = false;
      video.controls = false;

      video.onerror = () => {
        const code = video.error ? video.error.code : 0;
        // 1=aborted 2=network 3=decode(corrupt/unsupported) 4=src not supported
        errEl.textContent = code === 3 || code === 4
          ? 'This video file can\'t be played — it may be corrupted or an unsupported format. Try re-uploading a smaller/standard H.264 MP4.'
          : 'Couldn\'t load the video (network error). Check the file exists at the expected path and try again.';
        errEl.style.display = 'block';
        playBtn.classList.add('hidden');
      };

      playBtn.classList.remove('hidden');
      playBtn.onclick = () => {
        unlockBgm();
        video.play().then(() => {
          playBtn.classList.add('hidden');
          video.controls = true;
        }).catch((err) => {
          // Always hide the overlay on failure too, so it doesn't sit on
          // top masking whatever state the video is actually in.
          playBtn.classList.add('hidden');
          video.controls = true;
          errEl.textContent = 'Playback failed: ' + err.message;
          errEl.style.display = 'block';
        });
      };
      video.onended = () => {
        playBgm();
        showScreen('gif');
        startGifStage();
      };
      showScreen('video');
    } else {
      playBgm();
      showScreen('gif');
      startGifStage();
    }
  }

  let bgmUnlocked = false;
  // "Unlocks" the audio element by playing+immediately pausing it during a
  // real user tap. Strict browsers (mainly iOS Safari) only allow a media
  // element to start playing later without a fresh gesture if it has
  // already been played once during an actual gesture like this.
  function unlockBgm(){
    if(bgmUnlocked || !config.bgmUrl) return;
    bgmUnlocked = true;
    const bgm = document.getElementById('bgmAudio');
    if(!bgm.src) bgm.src = config.bgmUrl;
    const p = bgm.play();
    if(p && p.catch) p.catch(() => {});
    bgm.pause();
    bgm.currentTime = 0;
  }

  function playBgm(){
    if(!config.bgmUrl) return;
    const bgm = document.getElementById('bgmAudio');
    if(bgm.src && !bgm.paused) return; // already playing
    bgm.src = config.bgmUrl;
    bgm.loop = true;
    bgm.volume = 0.55;
    bgm.play().catch(() => {
      // Still blocked — fall back to starting it on the next tap anywhere,
      // and keep trying on every tap (not just once) until it succeeds.
      const resume = () => {
        bgm.play().then(() => {
          document.removeEventListener('click', resume);
          document.removeEventListener('touchend', resume);
        }).catch(() => {});
      };
      document.addEventListener('click', resume);
      document.addEventListener('touchend', resume);
    });
  }

  function burstConfetti(container){
    container.querySelectorAll('.fx-canvas').forEach(c => c.remove());
    const canvas = document.createElement('canvas');
    canvas.className = 'fx-canvas';
    container.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;

    const colors = ['#ff9fb0', '#ffc94d', '#f7876c', '#5b8fd6', '#bfe3e0', '#ffffff'];
    const originX = canvas.width / 2;
    const originY = canvas.height * 0.42;
    const gravity = 0.32;
    const groundY = canvas.height - 4;
    const particles = [];
    const count = 90;
    for(let i = 0; i < count; i++){
      const angle = Math.random() * Math.PI * 2;
      const speed = 4 + Math.random() * 9;
      particles.push({
        x: originX, y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3,
        size: 4 + Math.random() * 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.4,
        resting: false,
        round: Math.random() > 0.5,
      });
    }

    let start = null;
    const duration = 4200;
    const fadeStart = 3400;

    function frame(ts){
      if(!start) start = ts;
      const elapsed = ts - start;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach((p) => {
        if(!p.resting){
          p.vy += gravity;
          p.vx *= 0.995;
          p.x += p.vx;
          p.y += p.vy;
          p.rotation += p.vr;
          if(p.y >= groundY){
            p.y = groundY;
            p.vy *= -0.35;
            p.vx *= 0.6;
            if(Math.abs(p.vy) < 1.2){
              p.vy = 0;
              p.resting = true;
            }
          }
        }
        const alpha = elapsed > fadeStart ? Math.max(0, 1 - (elapsed - fadeStart) / (duration - fadeStart)) : 1;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        if(p.round){
          ctx.beginPath();
          ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
        }
        ctx.restore();
      });

      if(elapsed < duration){
        requestAnimationFrame(frame);
      } else {
        canvas.remove();
      }
    }
    requestAnimationFrame(frame);
  }

  function startHeartsRain(container){
    container.querySelectorAll('.fx-canvas').forEach(c => c.remove());
    const canvas = document.createElement('canvas');
    canvas.className = 'fx-canvas hearts-canvas';
    container.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;

    const emojis = ['❤️', '💕', '💖', '💗', '💓', '💞'];
    const gravity = 0.12;
    const groundY = canvas.height;
    const bucketCount = 26;
    const bucketWidth = canvas.width / bucketCount;
    const bucketHeights = new Array(bucketCount).fill(0);
    const hearts = [];

    let spawning = true;
    let animating = false;

    function ensureAnimating(){
      if(!animating){
        animating = true;
        requestAnimationFrame(frame);
      }
    }

    function frame(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let anyMoving = false;
      hearts.forEach((h) => {
        if(!h.resting){
          anyMoving = true;
          h.vy += gravity;
          h.y += h.vy;
          const bucket = Math.min(bucketCount - 1, Math.max(0, Math.floor(h.x / bucketWidth)));
          const floorForBucket = groundY - bucketHeights[bucket];
          if(h.y + h.size * 0.5 >= floorForBucket){
            h.y = floorForBucket - h.size * 0.5;
            h.resting = true;
            bucketHeights[bucket] += h.size * 0.6;
          }
        }
        ctx.save();
        ctx.font = h.size + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.translate(h.x, h.y);
        ctx.rotate(h.rotation);
        ctx.fillText(h.emoji, 0, 0);
        ctx.restore();
      });

      if(anyMoving || spawning){
        requestAnimationFrame(frame);
      } else {
        animating = false;
      }
    }

    const spawnInterval = setInterval(() => {
      if(!spawning){ clearInterval(spawnInterval); return; }
      hearts.push({
        x: Math.random() * canvas.width,
        y: -20,
        vy: 1 + Math.random() * 1.2,
        size: 20 + Math.random() * 16,
        emoji: emojis[Math.floor(Math.random() * emojis.length)],
        resting: false,
        rotation: (Math.random() - 0.5) * 0.6,
      });
      ensureAnimating();
    }, 180);

    setTimeout(() => { spawning = false; }, 9000);
    ensureAnimating();
  }

  function startGifStage(){
    const gifImg = document.getElementById('gifImg');
    const gifScreen = document.getElementById('screen-gif');
    const hint = document.querySelector('.gif-hint');
    gifImg.src = config.gif1Url || '';
    hint.style.display = config.gif1Url ? '' : 'none';
    gifScreen.classList.remove('switched');
    gifScreen.querySelectorAll('.fx-canvas').forEach(c => c.remove());

    let stage = 0; // 0 = showing gif1, 1 = showing gif2 (waiting for the fade-out tap)
    gifScreen.onclick = () => {
      unlockBgm();
      if(stage === 0){
        stage = 1;
        hint.style.display = 'none';
        if(config.gif2Url){
          gifImg.src = config.gif2Url;
          gifScreen.classList.add('switched');
          burstConfetti(gifScreen);
          return; // this tap only switches to gif2 — the NEXT tap fades it out
        }
        // no gif2 to show — fall through and advance immediately
      }
      gifScreen.onclick = null;
      advanceFromGif();
    };
  }

  function advanceFromGif(){
    if(config.video2Url || config.image3Url){
      showScreen('duo');
      startDuoStage();
    } else {
      triggerReveal();
    }
  }

  function startDuoStage(){
    const duoScreen = document.getElementById('screen-duo');
    const video2 = document.getElementById('duoVideo');
    const img3 = document.getElementById('duoImage');
    const duoHint = document.getElementById('duoHint');

    if(config.video2Url){
      video2.src = config.video2Url;
      video2.style.display = '';
      video2.play().catch(() => { /* autoplay may be blocked — video still shows first frame */ });
    } else {
      video2.style.display = 'none';
    }

    if(config.image3Url){
      img3.src = config.image3Url;
      img3.style.display = '';
    } else {
      img3.style.display = 'none';
    }

    duoHint.style.display = (config.video2Url || config.image3Url) ? '' : 'none';

    duoScreen.onclick = () => {
      unlockBgm();
      duoHint.style.display = 'none';
      duoScreen.onclick = null;
      triggerReveal();
    };
  }

  function triggerReveal(){
    const overlay = document.getElementById('whiteOverlay');
    const content = document.getElementById('revealContent');
    document.getElementById('revealMessage').textContent = (config.revealMessage && config.revealMessage.trim()) || 'Happy Birthday';
    document.getElementById('revealName').textContent = config.recipientName || '';

    setTimeout(() => {
      overlay.classList.add('show');
      const onEnd = (e) => {
        if(e.propertyName !== 'opacity') return;
        overlay.removeEventListener('transitionend', onEnd);
        content.classList.add('show');
        startHeartsRain(overlay);
      };
      overlay.addEventListener('transitionend', onEnd);
    }, 1600);
  }

  function render(){
    if(!hasMedia()){
      showScreen('empty');
      return;
    }

    startExperience();
  }

  // ---------- boot ----------
  (async function init(){
    await fetchContentData();
    render();
  })();
})();
</script>

</body>
</html>
